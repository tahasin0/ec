<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SmartShop</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">SmartShop</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="#products">Products</a></li>
          <li class="nav-item"><a class="nav-link" href="#cart">Cart</a></li>
          <li class="nav-item"><a class="nav-link" href="#login">Login</a></li>
          <li class="nav-item"><a class="nav-link" href="#dashboard">Dashboard</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Root Element for App -->
  <div id="app" class="container mt-5">
    <!-- App content will be dynamically rendered here -->
  </div>

  <!-- JS Scripts -->
  <script src="productController.js"></script>
  <script src="userController.js"></script>
  <script src="productRoutes.js"></script>
  <script src="userRoutes.js"></script>
  <script src="Dashboard.js"></script>
  <script src="CartScreen.js"></script>
  <script src="LoginScreen.js"></script>
  <script src="ProductListScreen.js"></script>
  <script src="App.js"></script>
  <script src="index.js"></script>

  <!-- Bootstrap JS (for navbar toggle) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
